[project]
name = "disco-backend"
version = "0.1.0"
description = "Disco campaign brain: FastAPI backend that turns an advertiser one-liner into ranked publishers, persona-tuned creatives and a campaign config, orchestrated with the OpenAI Agents SDK"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "openai>=3,<4",
    "openai-agents==0.22.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# real-bug rules only: pyflakes, import order, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # fastapi Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
