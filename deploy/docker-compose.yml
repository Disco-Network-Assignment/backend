# Production stack for one small EC2 box:
#
#   caddy     terminates TLS (a free certificate for the sslip.io hostname) and proxies to the API
#   api       the FastAPI app, built from the Dockerfile in the repo root
#   postgres  the agents' session memory and the run history
#
# Run from the repo root on the server:  docker compose -f deploy/docker-compose.yml up -d --build
# Secrets and the CORS origin come from the repo-root .env (copied by deploy/deploy.sh).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: disco
      POSTGRES_PASSWORD: disco
      POSTGRES_DB: disco
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disco -d disco"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      # inside the compose network the database is reachable by service name
      DATABASE_URL: postgresql+asyncpg://disco:disco@postgres:5432/disco
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # the public hostname Caddy gets a certificate for, e.g. 3-109-228-123.sslip.io
      BACKEND_HOST: ${BACKEND_HOST:?set BACKEND_HOST in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
